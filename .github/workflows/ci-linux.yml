# Linux build + test on every push and PR (WOR-303 S2). No signing, no secrets: like ci.yml, this
# workflow must stay runnable from a fork's pull request. ci.yml (macOS) is separate and stays
# byte-identical, so its now-stale comments ("no other runner this can use", "941 tests") stay as
# they are: rewording them would break the "ci.yml unchanged" acceptance of WOR-303, and the Mac
# test count is checked against that file's run, not its comment.
#
# Jobs (ADR-0002 D5):
#   arch         REQUIRED. archlinux:base pinned by digest, its packages pinned to the same day's
#                Arch Linux Archive snapshot, the Swift pin from docs/linux/dev.md installed as that
#                page describes. Debug build, serial tests, release build of `tkzmux` and its
#                relocated-install test (InstalledStubTests), then scripts/linux/check-linkage.sh
#                (NEEDED/RUNPATH only, per linkage-policy.txt; the ldd closure count is printed,
#                never gated) and scripts/linux/check-binary.sh. Then the musl release build of
#                `tkzmux-hook` through the pinned Static Linux SDK, run under `env -i` from a
#                copied location, and the same two checks against [tkzmux-hook] (WOR-305 S6).
#                Then tkzmux-vtdump: its ABI manifest, 50 rounds of scripts/state-crash-test.sh and
#                its linkage against [tkzmux-vtdump] (WOR-311 S7). Vulkan (WOR-313 S1): lavapipe
#                and the Khronos validation layer are installed, and TKZMUX_REQUIRE_VULKAN=1 turns
#                every GPU test that would skip without a device into a failure; `vtdump gpu` runs
#                the bootstrap and its clear + readback, `vtdump render` and `bench-frame` draw
#                through Vulkan (S6); the SPIR-V drift check regenerates the
#                committed shaders with the pinned shaderc (scripts/build-shaders-linux.sh --fetch).
#                GTK (WOR-314 S1): gtk4 is installed, `tkzmux --main-loop-check` runs on the
#                release build, and TkzGtkShellTests run headless (no display: GLib only).
#   ubuntu       ubuntu-24.04 + the pinned swift:<pin>-noble image (never the runner's own Swift):
#                one `swift build --target` per non-GTK target, and no tests. Restricted, not
#                retired, by WOR-314 S1: noble's GTK 4.14 is below the floor, so the test bundle
#                (which links GTK) cannot build there, but the per-target builds still check the
#                non-GTK code against glibc 2.39 and noble's older Vulkan, FreeType and HarfBuzz
#                headers, which the Arch image cannot (ADR-0002 D5).
#   arch-latest  Scheduled, NOT required: archlinux:latest with live mirrors, same steps as `arch`,
#                to catch rolling-release breakage before the pin is bumped.
#
# The release binary is built with the default (dynamic) stdlib, never the global
# `--static-swift-stdlib` (ADR-0001); WOR-323 owns the link mode. It is checked against the
# temporary [tkzmux-default-stdlib] section of linkage-policy.txt until WOR-323 S1 switches the
# check to [tkzmux] (docs/linux/build.md, "Linux CI").
#
# Every `swift test` step goes through the summary-line guard: exit status 0 is not enough,
# because the async main can `exit(0)` mid-run (Tests/TkzAppTests/SheetTestSupport.swift) and
# every test after that point silently never runs. Swift Testing prints its one
# `Test run with N tests` line only when the run finished; the step fails without it or on N = 0
# (the same rule as scripts/test-memory-probe.sh).
#
# Wall times (budget: 15 min per job with a warm cache). These `run:` steps, replayed in order on
# the reference machine outside a container on 2026-10-03 (docs/linux/build.md, "Linux CI"):
# `arch` 26 s cold (toolchain unpack 8 s, debug build 3 s, 355 tests 7 s, release build 8 s,
# checks < 1 s), `ubuntu` 10 s cold. Not yet measured on GitHub: image pull, package install
# and the 1.07 GB toolchain download; record them in build.md after the first runs.
#
# Shared steps are written once and reused with YAML anchors (&name / *name).
name: CI Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # arch-latest only; the other jobs skip scheduled runs. Mondays 05:17 UTC.
    - cron: '17 5 * * 1'

permissions:
  contents: read

# Same shape as ci.yml, but its own group: concurrency groups are repository-wide, and sharing
# `ci-<ref>` would let the two workflows cancel each other.
concurrency:
  group: ci-linux-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Explicit, so every step runs `bash -eo pipefail` (an unspecified shell in a container job
    # gets no pipefail, and a failing `swift test | tee` would pass).
    shell: bash

jobs:
  arch:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      # Bump the tag, the digest and ARCH_SNAPSHOT together (docs/linux/build.md, "Linux CI").
      image: archlinux:base-20260927.0.600689@sha256:b21322c663be387c0ed9cbc7bbbfe18e41633ad4e7b7c77cfad45f128be20040
    env:
      # The Arch Linux Archive day the image was built from, so `pacman -Syu` installs the same
      # package set on every run. Empty means live mirrors (arch-latest).
      ARCH_SNAPSHOT: '2026/09/27'
      # ParityFontsTests fails instead of skipping when the fetched parity fonts are missing.
      TKZMUX_REQUIRE_PARITY_FONTS: '1'
      # TkzRenderVKTests fails instead of skipping without a Vulkan device or the validation layer.
      TKZMUX_REQUIRE_VULKAN: '1'
      # The layer's synchronization validation too: a missing barrier in the ring or the atlas
      # uploads (WOR-313 S4a) is a hazard error, which the tests count.
      VK_KHRONOS_VALIDATION_VALIDATE_SYNC: '1'
    steps: &arch-steps
      # Before checkout: actions/checkout needs git in the container to fetch a real repository,
      # and actions/cache needs zstd.
      - name: Install system packages
        run: |
          if [ -n "$ARCH_SNAPSHOT" ]; then
            echo "Server = https://archive.archlinux.org/repos/$ARCH_SNAPSHOT/\$repo/os/\$arch" > /etc/pacman.d/mirrorlist
          fi
          # gcc: crt objects and libstdc++ for the toolchain's clang; binutils: ld.gold (the
          # default linker), readelf, nm, objdump; sqlite, curl, util-linux-libs, zlib, icu: the
          # toolchain binaries' own libraries; ncurses + libxml2-legacy: the compat sonames from
          # docs/linux/dev.md ("Compat libraries"); freetype2, harfbuzz, fontconfig: TkzFontsFT's
          # system libraries (WOR-312); zsh: the interactive-shell PtyTests, which skip without it
          # (WOR-305); vulkan-icd-loader, vulkan-headers: CVulkan (WOR-313); vulkan-swrast
          # (lavapipe) and vulkan-validation-layers: the device and the layer the GPU tests
          # require here; gtk4: CGtk (WOR-314; headers and libraries, floor 4.16). No shaderc:
          # the drift check fetches its own pinned build.
          pacman -Syu --noconfirm --needed \
            git gcc binutils sqlite curl util-linux-libs zlib icu ncurses libxml2-legacy \
            gnupg zstd pkgconf freetype2 harfbuzz fontconfig zsh \
            vulkan-icd-loader vulkan-headers vulkan-swrast vulkan-validation-layers gtk4
          pacman -Q glibc gcc binutils freetype2 harfbuzz fontconfig \
            vulkan-icd-loader vulkan-headers vulkan-swrast vulkan-validation-layers gtk4

      - uses: actions/checkout@v5

      # WOR-312 S4: the pinned parity fonts (Tests/Parity/Fonts/fonts.lock.json), downloaded once
      # per lockfile and SHA-256-checked by the script, into the directory the tests read
      # ($HOME/.cache/tkzmux/parity-fonts). Parity mode resolves fallback faces from them alone
      # (ParityFontsTests).
      - name: Cache the parity fonts
        uses: actions/cache@v5
        with:
          path: ~/.cache/tkzmux/parity-fonts
          key: parity-fonts-${{ hashFiles('Tests/Parity/Fonts/fonts.lock.json') }}

      - name: Fetch the parity fonts
        run: scripts/fetch-parity-fonts.sh

      - name: Read the Swift pin
        id: pin
        run: echo "swift=$(awk '$1 == "pin" && $2 == "swift" { print $3; exit }' docs/linux/dev.md)" >> "$GITHUB_OUTPUT"

      - name: Cache the Swift toolchain tarball
        uses: actions/cache@v5
        with:
          path: ~/.cache/swift-download
          key: swift-tarball-${{ steps.pin.outputs.swift }}-ubuntu24.04

      # docs/linux/dev.md, "Toolchain": the swift.org Ubuntu 24.04 tarball, signature-checked,
      # unpacked per user, with the ncurses compat links in the toolchain's RUNPATH directory.
      # libxml2.so.2 comes from the libxml2-legacy package installed above.
      - name: Install Swift ${{ steps.pin.outputs.swift }}
        env:
          PIN: ${{ steps.pin.outputs.swift }}
        run: |
          [ -n "$PIN" ] || { echo "::error::no 'pin swift' line in docs/linux/dev.md"; exit 1; }
          name="swift-$PIN-RELEASE-ubuntu24.04.tar.gz"
          base="https://download.swift.org/swift-$PIN-release/ubuntu2404/swift-$PIN-RELEASE"
          dl="$HOME/.cache/swift-download"
          root="$HOME/.local/share/swift/$PIN"
          mkdir -p "$dl" "$root"
          for f in "$name" "$name.sig"; do
            [ -s "$dl/$f" ] || curl -fsSL --retry 3 -o "$dl/$f" "$base/$f"
          done
          GNUPGHOME="$(mktemp -d)"; export GNUPGHOME
          curl -fsSL --compressed --retry 3 https://www.swift.org/keys/all-keys.asc | gpg --batch --quiet --import -
          gpg --batch --verify "$dl/$name.sig" "$dl/$name"
          tar -xzf "$dl/$name" -C "$root" --strip-components=1
          lib="$root/usr/lib/swift/linux"
          for l in ncurses form panel; do ln -sf "/usr/lib/lib${l}w.so.6" "$lib/lib$l.so.6"; done
          echo "$root/usr/bin" >> "$GITHUB_PATH"
          "$root/usr/bin/swift" --version 2>&1 | tee "$RUNNER_TEMP/swift-version"
          grep -qF "Swift version $PIN (swift-$PIN-RELEASE)" "$RUNNER_TEMP/swift-version"

      - name: Cache .build
        if: env.ARCH_SNAPSHOT != ''
        uses: actions/cache@v5
        with:
          path: .build
          key: ${{ github.job }}-swift-${{ steps.pin.outputs.swift }}-${{ hashFiles('Package.swift', 'vendor/ghostty-vt/COMMIT') }}-${{ github.sha }}
          restore-keys: ${{ github.job }}-swift-${{ steps.pin.outputs.swift }}-${{ hashFiles('Package.swift', 'vendor/ghostty-vt/COMMIT') }}-

      - name: Lint the linkage policy
        run: scripts/linux/check-linkage.sh --lint

      # WOR-313: the committed SPIR-V must be byte-for-byte what the pinned shaderc makes of the
      # GLSL. --fetch downloads the pinned Arch packages by sha256 (docs/linux/dev.md, "glslc pin")
      # instead of trusting whatever shaderc the image has.
      - name: Cache the pinned shaderc
        uses: actions/cache@v5
        with:
          path: ~/.cache/tkzmux/shaderc-cache
          key: shaderc-${{ hashFiles('scripts/build-shaders-linux.sh', 'docs/linux/dev.md') }}

      - name: SPIR-V drift check (pinned shaderc)
        run: SHADERC_CACHE="$HOME/.cache/tkzmux/shaderc-cache" scripts/build-shaders-linux.sh --fetch --check

      # CLAUDE.md: tkzmux-hook imports libc only (Darwin/Glibc/Musl), never Foundation. Also
      # checked by HookHygieneTests; this fails before anything is built (WOR-305 S5). The `!`
      # line must stay last: errexit ignores a negated command, so only the step's status counts.
      - name: tkzmux-hook imports no Foundation
        run: |
          ! grep -rnE '^[[:space:]]*(@_exported[[:space:]]+)?import[[:space:]]+(Foundation|FoundationEssentials|Dispatch|os)' Sources/tkzmux-hook

      - name: swift build
        run: swift build --build-system native

      # The summary-line guard, shared by the testing jobs (see the header). --no-parallel is required:
      # ci.yml explains why, and docs/linux/build.md ("Tests on Linux").
      # The arch job runs this step twice: the whole suite here, and once more after the release
      # build, with TKZMUX_BIN set, for the tests that run the `tkzmux` binary against the
      # release stub: InstalledStubTests (a relocated <prefix>/bin + <prefix>/lib/tkzmux tree) and
      # MainLoopBridgeTests (`--main-loop-check`). Without TKZMUX_TEST_STUB they use the debug one.
      - &swift-test
        name: swift test${{ env.TKZMUX_BIN && ' (InstalledStubTests, MainLoopBridgeTests, release stub)' || '' }}
        env:
          TKZMUX_TEST_STUB: ${{ env.TKZMUX_BIN }}
        run: |
          log="$RUNNER_TEMP/swift-test.log"
          filter=()
          if [ -n "$TKZMUX_TEST_STUB" ]; then filter=(--filter 'InstalledStubTests|MainLoopBridgeTests'); fi
          swift test --build-system native --no-parallel "${filter[@]}" 2>&1 | tee "$log"
          # Exit status 0 is not enough (header; scripts/test-memory-probe.sh): one
          # "Test run with N tests ..." line per finished run, every N > 0.
          counts="$(sed 's/\x1b\[[0-9;]*m//g' "$log" | sed -n 's/.*Test run with \([0-9][0-9]*\) tests\{0,1\} .*/\1/p')"
          if [ -z "$counts" ]; then
            echo "::error::swift test exited 0 without a 'Test run with N tests' line: the run ended early, and the tests after that point never ran"
            exit 1
          fi
          if grep -qx 0 <<< "$counts"; then
            echo "::error::swift test reported a run with 0 tests"
            exit 1
          fi
          echo "Swift Testing ran $(awk '{ n += $1 } END { print n }' <<< "$counts") tests"

      - name: Check the test runner's linkage
        run: scripts/linux/check-linkage.sh "$(swift build --build-system native --show-bin-path)/tkzmuxPackageTests.xctest" tests

      # Default stdlib, no global --static-swift-stdlib (ADR-0001); WOR-323 owns the link mode.
      - name: swift build -c release --product tkzmux
        run: |
          swift build --build-system native -c release --product tkzmux
          bin="$(swift build --build-system native -c release --show-bin-path)/tkzmux"
          echo "TKZMUX_BIN=$bin" >> "$GITHUB_ENV"
          "$bin" --version
          [ "$("$bin" --vt-smoke)" = "hello" ]
          "$bin" --main-loop-check

      - *swift-test

      - name: check-linkage.sh (NEEDED only)
        run: scripts/linux/check-linkage.sh "$TKZMUX_BIN" tkzmux-default-stdlib

      - name: check-binary.sh
        run: scripts/linux/check-binary.sh "$TKZMUX_BIN" --section tkzmux-default-stdlib

      # The shipped tkzmux-hook is the fully static musl build (docs/linux/hook.md, WOR-305 S6).
      # The SDK is pinned by version and sha256 in docs/linux/dev.md; it uses the toolchain's
      # ld.lld, which finds libxml2.so.2 through the libxml2-legacy package installed above.
      - name: Read the Static Linux SDK pin
        id: sdk
        run: |
          read -r version sum < <(awk '$1 == "pin" && $2 == "static-sdk" { print $3, $4; exit }' docs/linux/dev.md) || true
          [ -n "$version" ] && [ -n "$sum" ] || { echo "::error::no 'pin static-sdk' line in docs/linux/dev.md"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=${sum#sha256:}" >> "$GITHUB_OUTPUT"

      - name: Cache the Static Linux SDK
        uses: actions/cache@v5
        with:
          path: ~/.cache/swift-static-sdk
          key: swift-static-sdk-${{ steps.pin.outputs.swift }}-${{ steps.sdk.outputs.version }}

      - name: Install the Static Linux SDK
        env:
          PIN: ${{ steps.pin.outputs.swift }}
          SDK: ${{ steps.sdk.outputs.version }}
          SUM: ${{ steps.sdk.outputs.sha256 }}
        run: |
          name="swift-$PIN-RELEASE_static-linux-$SDK.artifactbundle.tar.gz"
          dl="$HOME/.cache/swift-static-sdk"
          mkdir -p "$dl"
          [ -s "$dl/$name" ] || curl -fsSL --retry 3 -o "$dl/$name" \
            "https://download.swift.org/swift-$PIN-release/static-sdk/swift-$PIN-RELEASE/$name"
          echo "$SUM  $dl/$name" | sha256sum -c -
          swift sdk install "$dl/$name"
          swift sdk list

      # Run under `env -i` from a copy in <HOME>/.local/share/tkzmux/bin, where the app installs
      # it: no toolchain, no LD_LIBRARY_PATH, no build tree.
      - name: swift build -c release --product tkzmux-hook (musl)
        run: |
          swift build --build-system native -c release --product tkzmux-hook --swift-sdk x86_64-swift-linux-musl
          hook="$(swift build --build-system native -c release --swift-sdk x86_64-swift-linux-musl --show-bin-path)/tkzmux-hook"
          echo "HOOK_BIN=$hook" >> "$GITHUB_ENV"
          home="$RUNNER_TEMP/hook-home"
          mkdir -p "$home/.local/share/tkzmux/bin"
          cp "$hook" "$home/.local/share/tkzmux/bin/"
          echo '{"session_id":"ci","model":{"display_name":"CI"}}' \
            | env -i HOME="$home" "$home/.local/share/tkzmux/bin/tkzmux-hook" statusline
          test -s "$home/.local/share/tkzmux/statusline/context-ci.json"

      - name: check-linkage.sh (tkzmux-hook)
        run: scripts/linux/check-linkage.sh "$HOOK_BIN" tkzmux-hook

      - name: check-binary.sh (tkzmux-hook)
        run: scripts/linux/check-binary.sh "$HOOK_BIN" --section tkzmux-hook

      # WOR-311 S7. The crash harness builds the release vtdump itself; `abi` must print exactly
      # the committed Linux manifest. `atlas` is a stub until WOR-312.
      # `gpu` (WOR-313 S1) selects lavapipe, the only device here, under the validation layer and
      # exits 1 on a readback mismatch or any validation error. `render` and `bench-frame`
      # (WOR-313 S6) draw through Vulkan on lavapipe under the same layer and exit 1 on any
      # validation error; a recording rendered twice must give the same PNG, and its sha256 is
      # printed so two runs can be compared.
      - name: tkzmux-vtdump (abi, state-crash-test.sh, gpu, render, bench-frame, linkage)
        run: |
          scripts/state-crash-test.sh 50
          vtdump="$(swift build --build-system native -c release --show-bin-path)/tkzmux-vtdump"
          "$vtdump" abi | diff - vendor/ghostty-vt/abi-types.x86_64-linux-gnu.json
          "$vtdump" gpu | tee "$RUNNER_TEMP/vtdump-gpu.txt"
          grep -q '^loader: .*validation on$' "$RUNNER_TEMP/vtdump-gpu.txt"
          for scale in 2 1.6; do
            for run in a b; do
              "$vtdump" render --fonts parity --scale "$scale" --out "$RUNNER_TEMP/render-$scale-$run.png" \
                Tests/TkzTerminalCoreTests/Fixtures/claude-tool-run.tkzrec
            done
            cmp "$RUNNER_TEMP/render-$scale-a.png" "$RUNNER_TEMP/render-$scale-b.png"
            sha256sum "$RUNNER_TEMP/render-$scale-a.png"
          done
          "$vtdump" bench-frame --fonts parity --frames 20 --warmup 2 --validation
          scripts/linux/check-linkage.sh "$vtdump" tkzmux-vtdump

  ubuntu:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      # The `pin image` line of docs/linux/dev.md; bump both together.
      image: swift:6.3.3-noble@sha256:cd45c27b3abc42310c33cfaf3008b18156cbdc9187834c9617e8f43a26d2675c
    env:
      # Every non-GTK target, one `swift build --target` each. GhosttyVt is a binary target and
      # cannot be built on its own; its dependents cover it, and so do TkzFontsFT's for the
      # system-library targets CFreeType, CHarfBuzz and CFontconfig. A target that joins the Linux
      # graph without GTK is added here (WOR-304 onwards). Never CGtk, TkzLinuxShim, TkzGtkShell
      # or anything that depends on them: TkzmuxLinux (the `tkzmux` entry) left the list when it
      # started linking TkzGtkShell (WOR-314 S1). SwiftPM warns that gtk4's .pc is missing; that
      # is expected here.
      NON_GTK_TARGETS: TkzPlatformShim TkzPtyShim TkzPlatform TkzCore TkzTerminalCore Persistence TkzShaderTypes TkzRenderCore TkzPNG TkzPlatformTests TkzCoreTests TkzTerminalCoreTests PersistenceTests GhosttyVtSmokeTests TkzRenderCoreTests TkzPNGTests TkzShadersSPIRVTests tkzmux-hook AgentBridgeTests TkzFontsFT TkzFontsFTTests TkzRenderVK TkzRenderVKTests tkzmux-vtdump
    steps:
      - name: Install system packages
        run: |
          apt-get update -q
          # Build-only since WOR-314 S1, so the test-only packages (shells, iproute2, the parity
          # font download) are gone. libfreetype-dev, libharfbuzz-dev, libfontconfig-dev:
          # TkzFontsFT's system libraries (WOR-312). libvulkan-dev: CVulkan (WOR-313). Never
          # libgtk-4-dev: 4.14, below the floor.
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            git binutils pkg-config \
            libfreetype-dev libharfbuzz-dev libfontconfig-dev libvulkan-dev
          dpkg-query -W libfreetype-dev libharfbuzz-dev libfontconfig-dev libvulkan-dev

      - uses: actions/checkout@v5

      - name: Read the Swift pin
        id: pin
        run: |
          pin="$(awk '$1 == "pin" && $2 == "swift" { print $3; exit }' docs/linux/dev.md)"
          echo "swift=$pin" >> "$GITHUB_OUTPUT"
          swift --version 2>&1 | tee "$RUNNER_TEMP/swift-version"
          grep -qF "Swift version $pin (swift-$pin-RELEASE)" "$RUNNER_TEMP/swift-version" \
            || { echo "::error::the image's Swift is not the docs/linux/dev.md pin ($pin)"; exit 1; }

      - name: Cache .build
        uses: actions/cache@v5
        with:
          path: .build
          key: ${{ github.job }}-swift-${{ steps.pin.outputs.swift }}-${{ hashFiles('Package.swift', 'vendor/ghostty-vt/COMMIT') }}-${{ github.sha }}
          restore-keys: ${{ github.job }}-swift-${{ steps.pin.outputs.swift }}-${{ hashFiles('Package.swift', 'vendor/ghostty-vt/COMMIT') }}-

      - name: swift build --target (non-GTK targets)
        run: |
          for t in $NON_GTK_TARGETS; do
            echo "::group::swift build --target $t"
            swift build --build-system native --target "$t"
            echo "::endgroup::"
          done

      # No `swift test` here (WOR-314 S1): the test bundle links every test target, TkzGtkShellTests
      # included, and noble's GTK 4.14 is below the floor. The `arch` job runs the tests.

  arch-latest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: archlinux:latest
    env:
      ARCH_SNAPSHOT: ''
      TKZMUX_REQUIRE_PARITY_FONTS: '1'
      TKZMUX_REQUIRE_VULKAN: '1'
      VK_KHRONOS_VALIDATION_VALIDATE_SYNC: '1'
    steps: *arch-steps
