# Build + test on every push and PR. No signing, no secrets — this workflow must stay runnable
# from a fork's pull request. The release path lives in release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # tkzmux is macOS 26+ / arm64 only (Package.swift platform, and libghostty-vt is vendored as
    # an arm64-only static xcframework), so there is no other runner this can use.
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.1
        run: |
          sudo xcode-select -s /Applications/Xcode_26.1.app
          swift --version

      - name: swift build
        run: swift build

      # The shell-integration harness (TKZ-33) runs every supported login shell -- zsh and bash
      # ship with macOS, fish does not -- and records an issue rather than silently shrinking the
      # run when fish is missing. Bottled, so this is seconds.
      - name: Install fish for the shell-integration harness
        run: brew install fish

      # Swift Testing. No GUI session on a runner, so anything needing a window must be marked
      # .disabled/.enabled(if:) in the test target rather than skipped here.
      #
      # --no-parallel is required, not a preference. Several tests assert timing behaviour -- the
      # autosaver's debounce, and that a background session's output never wakes the display link --
      # and they wait on the main actor. Run in parallel, the process-spawning ClaudeBridge suites
      # starve it; `StateAutosaverTests.settle` already carries a 10 s timeout and a comment about
      # this, and on a 3-core runner even 10 s is not enough (observed: writeCount still 0 after the
      # full timeout, the test failing after 14 s). Raising those timeouts further would only make a
      # genuine regression take longer to report. Serial costs ~20 s here and makes them
      # deterministic: 941 tests, 28 s serial vs 8 s parallel on the development Mac.
      - name: swift test
        run: swift test --no-parallel
