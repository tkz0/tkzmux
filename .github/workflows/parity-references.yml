# Regenerates the Mac parity references (WOR-322 S2) on the reference runner: the macos-26 image
# with Xcode 26.1, the same runner class and toolchain as ci.yml (ADR-0003 §5). Started by hand, or
# by pushing a `mac-refs/*` branch (workflow_dispatch only reaches workflows on main). macOS minutes
# cost, and a reference set is committed by a person in a reviewed PR, never by CI.
#
# `make parity-references` (scripts/parity-export-mac.sh) writes the whole of
# Tests/Parity/References/: WOR-312's font and chrome dumps through their own scripts, the L2
# FrameBuilder dumps, the terminal frames and manifest.json. Its --check run then writes everything
# again from fresh processes and fails unless the two agree byte for byte (the manifests'
# provenance lines aside). The folder is uploaded either way, as `parity-references`, so its
# contents go straight into Tests/Parity/References/. docs/linux/parity.md, "Regenerating the
# references".
name: Parity references

on:
  workflow_dispatch:
  push:
    branches: ['mac-refs/**']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  regenerate:
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.1
        run: |
          sudo xcode-select -s /Applications/Xcode_26.1.app
          swift --version

      # --regenerate: a new image is the reason to run this at all; the manifest records which.
      - name: Write the parity references
        run: make parity-references PARITY_FLAGS=--regenerate

      - name: Check them from a second run
        run: make parity-references PARITY_FLAGS=--check

      - name: Upload the parity references
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: parity-references
          path: Tests/Parity/References
          if-no-files-found: ignore
